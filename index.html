<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>コミュニケーションパターン解析</title>
<link rel="apple-touch-icon" href="icon.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100;300;400&family=Share+Tech+Mono&display=swap');

:root {
–bg: #0a0a0a;
–surface: #111111;
–border: #222222;
–text: #cccccc;
–text-dim: #555555;
–accent: #ff3333;
–accent-dim: #331111;
–mono: ‘Share Tech Mono’, monospace;
–sans: ‘Noto Sans JP’, sans-serif;
}

- { box-sizing: border-box; margin: 0; padding: 0; }

body {
background: var(–bg);
color: var(–text);
font-family: var(–sans);
font-weight: 300;
min-height: 100vh;
padding: 40px 20px;
}

.container {
max-width: 640px;
margin: 0 auto;
}

.header {
margin-bottom: 48px;
border-left: 1px solid var(–accent);
padding-left: 20px;
}

.header .label {
font-family: var(–mono);
font-size: 10px;
color: var(–text-dim);
letter-spacing: 0.2em;
text-transform: uppercase;
margin-bottom: 12px;
}

.header h1 {
font-size: 18px;
font-weight: 100;
letter-spacing: 0.05em;
line-height: 1.6;
}

.step {
display: none;
animation: fadeIn 0.3s ease;
}

.step.active { display: block; }

@keyframes fadeIn {
from { opacity: 0; transform: translateY(8px); }
to { opacity: 1; transform: translateY(0); }
}

.question-label {
font-family: var(–mono);
font-size: 10px;
color: var(–text-dim);
letter-spacing: 0.2em;
margin-bottom: 16px;
}

.question-text {
font-size: 15px;
font-weight: 300;
line-height: 1.8;
margin-bottom: 28px;
color: var(–text);
}

.options {
display: flex;
flex-direction: column;
gap: 8px;
margin-bottom: 32px;
}

.option {
background: var(–surface);
border: 1px solid var(–border);
color: var(–text);
padding: 14px 18px;
text-align: left;
cursor: pointer;
font-family: var(–sans);
font-weight: 300;
font-size: 14px;
line-height: 1.6;
transition: all 0.15s;
border-radius: 2px;
}

.option:hover {
border-color: var(–accent);
background: var(–accent-dim);
}

.option.selected {
border-color: var(–accent);
background: var(–accent-dim);
color: #ffffff;
}

.checkbox-options {
display: flex;
flex-direction: column;
gap: 8px;
margin-bottom: 32px;
}

.checkbox-option {
background: var(–surface);
border: 1px solid var(–border);
color: var(–text);
padding: 14px 18px;
text-align: left;
cursor: pointer;
font-family: var(–sans);
font-weight: 300;
font-size: 14px;
line-height: 1.6;
transition: all 0.15s;
border-radius: 2px;
display: flex;
align-items: flex-start;
gap: 12px;
}

.checkbox-option:hover {
border-color: #444;
}

.checkbox-option.checked {
border-color: var(–accent);
background: var(–accent-dim);
color: #ffffff;
}

.checkbox-mark {
font-family: var(–mono);
font-size: 12px;
color: var(–text-dim);
min-width: 16px;
margin-top: 1px;
}

.checkbox-option.checked .checkbox-mark {
color: var(–accent);
}

.btn {
background: transparent;
border: 1px solid var(–text-dim);
color: var(–text-dim);
padding: 12px 24px;
cursor: pointer;
font-family: var(–mono);
font-size: 11px;
letter-spacing: 0.15em;
text-transform: uppercase;
transition: all 0.15s;
border-radius: 2px;
}

.btn:hover {
border-color: var(–text);
color: var(–text);
}

.btn.primary {
border-color: var(–accent);
color: var(–accent);
}

.btn.primary:hover {
background: var(–accent);
color: #000;
}

.btn:disabled {
opacity: 0.3;
cursor: not-allowed;
}

.progress {
font-family: var(–mono);
font-size: 10px;
color: var(–text-dim);
margin-bottom: 32px;
letter-spacing: 0.1em;
}

.progress-bar {
height: 1px;
background: var(–border);
margin-top: 8px;
position: relative;
}

.progress-fill {
height: 100%;
background: var(–accent);
transition: width 0.3s ease;
}

/* Result */
.result {
display: none;
animation: fadeIn 0.5s ease;
}

.result.active { display: block; }

.result-header {
border-left: 1px solid var(–accent);
padding-left: 20px;
margin-bottom: 40px;
}

.result-label {
font-family: var(–mono);
font-size: 10px;
color: var(–accent);
letter-spacing: 0.2em;
margin-bottom: 12px;
}

.result-title {
font-size: 22px;
font-weight: 100;
letter-spacing: 0.05em;
margin-bottom: 8px;
}

.result-subtitle {
font-size: 12px;
color: var(–text-dim);
font-family: var(–mono);
}

.game-card {
border: 1px solid var(–border);
border-radius: 2px;
margin-bottom: 16px;
overflow: hidden;
}

.game-card-header {
background: var(–surface);
padding: 16px 20px;
border-bottom: 1px solid var(–border);
}

.game-name {
font-size: 14px;
font-weight: 400;
margin-bottom: 4px;
}

.game-trigger {
font-family: var(–mono);
font-size: 10px;
color: var(–text-dim);
letter-spacing: 0.1em;
}

.game-body {
padding: 20px;
}

.game-section {
margin-bottom: 16px;
}

.game-section:last-child { margin-bottom: 0; }

.game-section-label {
font-family: var(–mono);
font-size: 9px;
color: var(–text-dim);
letter-spacing: 0.2em;
text-transform: uppercase;
margin-bottom: 8px;
}

.game-section-text {
font-size: 13px;
font-weight: 300;
line-height: 1.8;
color: var(–text);
}

.advice-text {
font-size: 13px;
font-weight: 300;
line-height: 1.8;
color: #aaaaaa;
}

.no-pattern {
padding: 32px 0;
font-size: 14px;
font-weight: 300;
line-height: 1.8;
color: var(–text-dim);
font-family: var(–mono);
}

.restart-area {
margin-top: 40px;
padding-top: 24px;
border-top: 1px solid var(–border);
}

.nav-area {
display: flex;
gap: 12px;
align-items: center;
}

.situation-note {
font-size: 11px;
color: var(–text-dim);
line-height: 1.6;
margin-top: 8px;
font-family: var(–mono);
}
</style>

</head>
<body>
<div class="container">
  <div class="header">
    <div class="label">DIAGNOSTIC SYSTEM v1.0</div>
    <h1>コミュニケーション<br>パターン解析</h1>
  </div>

  <!-- Step 1: 相手との関係 -->

  <div class="step active" id="step1">
    <div class="progress">
      STEP 01 / 04
      <div class="progress-bar"><div class="progress-fill" style="width:25%"></div></div>
    </div>
    <div class="question-label">RELATION</div>
    <div class="question-text">相手はどんな関係ですか？</div>
    <div class="options" id="relation-options">
      <button class="option" data-value="partner" onclick="selectOption('relation', this)">恋人・パートナー</button>
      <button class="option" data-value="family" onclick="selectOption('relation', this)">家族</button>
      <button class="option" data-value="work" onclick="selectOption('relation', this)">職場・上司・同僚</button>
      <button class="option" data-value="friend" onclick="selectOption('relation', this)">友人</button>
      <button class="option" data-value="other" onclick="selectOption('relation', this)">その他</button>
    </div>
    <div class="nav-area">
      <button class="btn primary" onclick="goToStep(2)" id="btn1" disabled>NEXT</button>
    </div>
  </div>

  <!-- Step 2: 繰り返すパターン -->

  <div class="step" id="step2">
    <div class="progress">
      STEP 02 / 04
      <div class="progress-bar"><div class="progress-fill" style="width:50%"></div></div>
    </div>
    <div class="question-label">PATTERN</div>
    <div class="question-text">繰り返し起きていること。<br>当てはまるものをすべて選んでください。</div>
    <div class="checkbox-options" id="pattern-options">
      <button class="checkbox-option" data-value="blame" onclick="togglePattern(this)">
        <span class="checkbox-mark">[ ]</span>
        <span>謝るが、自分が悪いとは言わない</span>
      </button>
      <button class="checkbox-option" data-value="control" onclick="togglePattern(this)">
        <span class="checkbox-mark">[ ]</span>
        <span>善意のふりをして支配してくる</span>
      </button>
      <button class="checkbox-option" data-value="trap" onclick="togglePattern(this)">
        <span class="checkbox-mark">[ ]</span>
        <span>ミスを待ち構えて攻撃してくる</span>
      </button>
      <button class="checkbox-option" data-value="corner" onclick="togglePattern(this)">
        <span class="checkbox-mark">[ ]</span>
        <span>どちらを選んでも罰になる</span>
      </button>
      <button class="checkbox-option" data-value="yesno" onclick="togglePattern(this)">
        <span class="checkbox-mark">[ ]</span>
        <span>助言を求めるが、全部却下する</span>
      </button>
      <button class="checkbox-option" data-value="violence" onclick="togglePattern(this)">
        <span class="checkbox-mark">[ ]</span>
        <span>挑発して、自分が被害者になる</span>
      </button>
      <button class="checkbox-option" data-value="woodenleg" onclick="togglePattern(this)">
        <span class="checkbox-mark">[ ]</span>
        <span>自分のハンデや不幸を理由に責任を取らない</span>
      </button>
      <button class="checkbox-option" data-value="court" onclick="togglePattern(this)">
        <span class="checkbox-mark">[ ]</span>
        <span>第三者を巻き込んで正当化する</span>
      </button>
    </div>
    <div class="nav-area">
      <button class="btn" onclick="goToStep(1)">BACK</button>
      <button class="btn primary" onclick="goToStep(3)" id="btn2" disabled>NEXT</button>
    </div>
  </div>

  <!-- Step 3: 今の状況 -->

  <div class="step" id="step3">
    <div class="progress">
      STEP 03 / 04
      <div class="progress-bar"><div class="progress-fill" style="width:75%"></div></div>
    </div>
    <div class="question-label">STATUS</div>
    <div class="question-text">今の状況は？</div>
    <div class="options" id="status-options">
      <button class="option" data-value="ongoing" onclick="selectOption('status', this)">関係が続いている</button>
      <button class="option" data-value="distance" onclick="selectOption('status', this)">距離を置いている</button>
      <button class="option" data-value="ended" onclick="selectOption('status', this)">終わった</button>
    </div>
    <div class="nav-area">
      <button class="btn" onclick="goToStep(2)">BACK</button>
      <button class="btn primary" onclick="goToStep(4)" id="btn3" disabled>NEXT</button>
    </div>
  </div>

  <!-- Step 4: 自分の状態 -->

  <div class="step" id="step4">
    <div class="progress">
      STEP 04 / 04
      <div class="progress-bar"><div class="progress-fill" style="width:100%"></div></div>
    </div>
    <div class="question-label">YOUR STATE</div>
    <div class="question-text">今の自分の状態は？</div>
    <div class="options" id="state-options">
      <button class="option" data-value="angry" onclick="selectOption('state', this)">まだ怒りが強い</button>
      <button class="option" data-value="calm" onclick="selectOption('state', this)">少し冷静に見られる</button>
      <button class="option" data-value="organize" onclick="selectOption('state', this)">整理したい</button>
    </div>
    <div class="nav-area">
      <button class="btn" onclick="goToStep(3)">BACK</button>
      <button class="btn primary" onclick="showResult()" id="btn4" disabled>解析する</button>
    </div>
  </div>

  <!-- Result -->

  <div class="result" id="result">
    <div class="result-header">
      <div class="result-label">ANALYSIS COMPLETE</div>
      <div class="result-title" id="result-title">解析結果</div>
      <div class="result-subtitle" id="result-subtitle"></div>
    </div>
    <div id="result-cards"></div>
    <div class="restart-area">
      <button class="btn" onclick="restart()">もう一度解析する</button>
    </div>
  </div>
</div>

<script>
const answers = {
  relation: null,
  patterns: [],
  status: null,
  state: null
};

const games = {
  blame: {
    name: '「あなたのせいだ」ゲーム',
    trigger: '謝るが非を認めない',
    description: '謝罪の言葉を使いながら、実際には責任を相手に転嫁するパターン。「お前が○○したから自分もこうなった」という形で、自分の行動の責任を常に外部に求める。表面上は謝っているように見えるため、指摘しにくい。',
    advice: {
      ongoing: '相手の謝罪が「でも」や「だって」で続く場合、それは謝罪ではなく反論だ。謝罪と責任転嫁を切り分けて聞く練習をすると、パターンが見えやすくなる。',
      distance: '距離を置いているなら、相手の謝罪メッセージをそのまま受け取らず、「何に対して謝っているか」を具体的に確認してから返答する。',
      ended: 'このゲームの中にいた自分は、ずっと「自分が悪いのかもしれない」と思わされ続けた可能性がある。そうではなかった。パターンの名前が見えた今、その重さを手放していい。'
    }
  },
  control: {
    name: '「あなたのために」ゲーム',
    trigger: '善意のふりをした支配',
    description: '支配や干渉を「善意」として包むパターン。相手が抵抗すると「せっかくやってあげているのに」と被害者になる。親切に見えるため、支配されていると気づきにくい。自立しようとすると関係が壊れる構造になっている。',
    advice: {
      ongoing: '「あなたのために言っている」という言葉が出たとき、その後に何を要求されているかを見る。善意と支配の違いは、こちらの自由が保たれているかどうかだ。',
      distance: '「あなたのことを心配している」という接触を受けた場合、その心配の中に自分への要求が含まれていないか確認する。',
      ended: '関係の中で自分の判断を信じられなくなっていた場合、それはこのゲームの影響かもしれない。自分の感覚は正しかった。'
    }
  },
  trap: {
    name: '「あなたを捕まえた」ゲーム',
    trigger: 'ミスを待ち構えて攻撃',
    description: '相手のミスや矛盾を待ち構えて、見つけた瞬間に攻撃するパターン。正義の執行者を装っているが、目的は相手を正しく直すことではなく、相手を「悪い側」に置くことだ。',
    advice: {
      ongoing: 'ミスを指摘されるたびに委縮している場合、それはこのゲームに取り込まれているサインかもしれない。ミスの内容より、相手の反応のパターンを見る。',
      distance: 'SNSや共通の知人を通じた監視・批判が続いている場合、このパターンの延長として行われている可能性がある。',
      ended: '「あのとき自分が悪かった」という罪悪感が残っている場合、それがゲームによって植え付けられたものかどうか、冷静に検証する価値がある。'
    }
  },
  corner: {
    name: '「コーナー」ゲーム',
    trigger: 'どちらを選んでも罰になる',
    description: 'どちらを選んでも相手に非を問われる選択肢を提示するパターン。「行くのも行かないのも怒る」「言っても言わなくても責める」という形で、出口のない状況を作る。長期間続くと判断力が麻痺する。',
    advice: {
      ongoing: 'どちらを選んでも攻撃されると感じているなら、問題は自分の選択ではなくゲームの構造にある。選択肢を変えても解決しない。',
      distance: '距離を置いても「連絡しないのも悪い」「連絡するのも迷惑」という矛盾したメッセージが来る場合、コーナーゲームが続いている。',
      ended: '抜け出せなかった理由はこの構造にある。どこに行っても捕まる設計になっていた。逃げられなかったのは弱さではない。'
    }
  },
  yesno: {
    name: '「はい、でも」ゲーム',
    trigger: '助言を全部却下する',
    description: '助言や提案を求めておきながら、すべてを「はい、でも〜」で却下するパターン。目的は問題を解決することではなく、「誰にも解決できない」ことを証明することだ。相手を疲弊させて諦めさせる効果がある。',
    advice: {
      ongoing: '何を提案しても却下される場合、提案の質の問題ではない。提案すること自体をやめてみると、関係の構造が見えやすくなる。',
      distance: '「相談に乗ってほしい」という連絡が来ても、過去のパターンが繰り返される可能性が高い。',
      ended: 'あなたの提案が悪かったのではない。ゲームの設計上、何を言っても採用されなかった。'
    }
  },
  violence: {
    name: '「暴力沙汰」ゲーム',
    trigger: '挑発して被害者になる',
    description: '段階的に相手を挑発して、相手が爆発したところで被害者の立場を取るパターン。加害と被害が逆転して見える構造を作り出す。DVやモラハラで頻繁に使われる。',
    advice: {
      ongoing: '自分が感情的になってしまうことで罪悪感を持っているなら、その前に何が起きていたかを記録しておくことが有効だ。',
      distance: '「あなたが怒鳴った」「あなたが暴力的だった」という記憶の書き換えが行われている場合、自分の記録と照合する。',
      ended: '「自分が感情的すぎた」という後悔があるなら、それが挑発の結果だった可能性を検証してみて。あなたは悪くなかったかもしれない。'
    }
  },
  woodenleg: {
    name: '「木の足」ゲーム',
    trigger: '不幸を理由に責任回避',
    description: '自分の不幸・病気・過去のトラウマ・環境を理由に、責任を免除させようとするパターン。「自分はこんなに苦労してきたから仕方ない」という形で使われる。同情を引くことで攻撃への免責を得る。',
    advice: {
      ongoing: '相手の苦労や背景に同情することと、その行動を許容することは別だ。理由がどれだけ深刻でも、あなたが傷つけられていい理由にはならない。',
      distance: '過去の辛さを強調する連絡が来ても、それがゲームの一部である可能性がある。',
      ended: '相手の不幸に責任を感じている場合、それは意図的に植え付けられた感覚かもしれない。'
    }
  },
  court: {
    name: '「裁判所」ゲーム',
    trigger: '第三者を巻き込んで正当化',
    description: '共通の知人や家族など第三者を巻き込んで、自分の正しさを証明させようとするパターン。「みんなもそう言っている」という形で多数決による圧力をかける。集団ハラスメントに発展することもある。',
    advice: {
      ongoing: '第三者を通じた圧力を感じているなら、その第三者が完全な情報を持っていない可能性が高い。一対一で話す場を求めることが有効な場合がある。',
      distance: '共通の知人を通じた情報操作が行われている可能性がある。直接の情報源を確認する。',
      ended: '周囲の評価が気になっているなら、その評価がどんな情報を基にしているかを考える。あなたの側の話を知らない人間の判断には限界がある。'
    }
  }
};

function selectOption(type, btn) {
  const parent = btn.parentElement;
  parent.querySelectorAll('.option').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  answers[type] = btn.dataset.value;

  if (type === 'relation') document.getElementById('btn1').disabled = false;
  if (type === 'status') document.getElementById('btn3').disabled = false;
  if (type === 'state') document.getElementById('btn4').disabled = false;
}

function togglePattern(btn) {
  const val = btn.dataset.value;
  const mark = btn.querySelector('.checkbox-mark');

  if (btn.classList.contains('checked')) {
    btn.classList.remove('checked');
    mark.textContent = '[ ]';
    answers.patterns = answers.patterns.filter(p => p !== val);
  } else {
    btn.classList.add('checked');
    mark.textContent = '[x]';
    answers.patterns.push(val);
  }

  document.getElementById('btn2').disabled = answers.patterns.length === 0;
}

function goToStep(n) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById('step' + n).classList.add('active');
}

function showResult() {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById('result').classList.add('active');

  const status = answers.status;
  const state = answers.state;
  const cards = document.getElementById('result-cards');
  cards.innerHTML = '';

  const statusLabels = { ongoing: '関係継続中', distance: '距離を置いている', ended: '終わった' };
  const stateLabels = { angry: '怒り強め', calm: '冷静に見られる', organize: '整理したい' };

  document.getElementById('result-subtitle').textContent =
    `${statusLabels[status]} / ${stateLabels[state]}`;

  if (answers.patterns.length === 0) {
    cards.innerHTML = '<div class="no-pattern">パターンが選択されていません。</div>';
    return;
  }

  document.getElementById('result-title').textContent =
    `${answers.patterns.length}つのパターンを検出`;

  answers.patterns.forEach(p => {
    const g = games[p];
    if (!g) return;

    const advice = g.advice[status] || g.advice['ended'];

    const card = document.createElement('div');
    card.className = 'game-card';
    card.innerHTML = `
      <div class="game-card-header">
        <div class="game-name">${g.name}</div>
        <div class="game-trigger">TRIGGER: ${g.trigger}</div>
      </div>
      <div class="game-body">
        <div class="game-section">
          <div class="game-section-label">STRUCTURE</div>
          <div class="game-section-text">${g.description}</div>
        </div>
        <div class="game-section">
          <div class="game-section-label">ADVICE</div>
          <div class="advice-text">${advice}</div>
        </div>
      </div>
    `;
    cards.appendChild(card);
  });
}

function restart() {
  answers.relation = null;
  answers.patterns = [];
  answers.status = null;
  answers.state = null;

  document.querySelectorAll('.option').forEach(b => b.classList.remove('selected'));
  document.querySelectorAll('.checkbox-option').forEach(b => {
    b.classList.remove('checked');
    b.querySelector('.checkbox-mark').textContent = '[ ]';
  });

  ['btn1','btn2','btn3','btn4'].forEach(id => {
    document.getElementById(id).disabled = true;
  });

  document.getElementById('result').classList.remove('active');
  document.getElementById('step1').classList.add('active');
}
</script>
