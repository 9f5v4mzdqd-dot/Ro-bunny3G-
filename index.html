<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COMM_DEBUG_v2.0</title>

  <!-- iPhoneホーム画面アイコン -->
  <link rel="apple-touch-icon" href="icon.png">

  <!-- favicon -->
  <link rel="icon" type="image/png" href="icon.png">

  <!-- フォント -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100;400&display=swap" rel="stylesheet">

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      background:#1c1f24;
      color:#d4d8de;
      font-family:'Noto Sans JP',sans-serif;
      background-image: radial-gradient(#22262c 1px, transparent 0);
      background-size:20px 20px;
      min-height:100vh;
      padding:40px 20px;
    }

    .container{
      max-width:600px;
      margin:0 auto;
    }

    .header{
      margin-bottom:56px;
      border-left:3px solid #7eb8d4;
      padding-left:20px;
    }

    .header-label{
      font-family:monospace;
      font-size:9px;
      color:#7eb8d4;
      letter-spacing:0.15em;
      margin-bottom:12px;
    }

    h1{
      font-size:20px;
      font-weight:100;
      letter-spacing:0.1em;
      line-height:1.5;
      text-transform:uppercase;
      color:#e8eaed;
    }

    .progress{
      font-family:monospace;
      font-size:10px;
      color:#555b66;
      margin-bottom:36px;
    }

    .progress-bar{
      height:1px;
      background:#2e333b;
      margin-top:10px;
    }

    .progress-fill{
      height:100%;
      width:25%;
      background:#7eb8d4;
      box-shadow:0 0 6px #7eb8d4;
      transition:width .4s ease;
    }

    .q-label{
      font-family:monospace;
      font-size:11px;
      color:#7eb8d4;
      margin-bottom:16px;
    }

    .q-text{
      font-size:16px;
      margin-bottom:32px;
      line-height:1.7;
      color:#c8cdd5;
    }

    .option-btn{
      width:100%;
      background:#22262c;
      border:1px solid #2e333b;
      color:#b0b8c4;
      padding:14px 18px;
      text-align:left;
      cursor:pointer;
      margin-bottom:10px;
      font-size:13px;
      transition:all .15s;
    }

    .option-btn:hover{
      border-color:#7eb8d4;
      color:#e8eaed;
    }

    .option-btn.selected{
      background:#2a4a5e;
      border-color:#7eb8d4;
      color:#e8eaed;
    }

    .nav{
      display:flex;
      gap:12px;
      margin-top:20px;
    }

    .btn{
      background:transparent;
      border:1px solid #444b55;
      color:#777f8a;
      padding:12px 24px;
      cursor:pointer;
      font-family:monospace;
      font-size:11px;
      letter-spacing:0.15em;
      transition:all .15s;
    }

    .btn.primary{
      border-color:#7eb8d4;
      color:#7eb8d4;
    }

    .btn:hover{
      background:#22262c;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="header-label">COMM_DEBUG_v2.0</div>
    <h1>対人構造解析<br>プロトコル</h1>
  </div>

  <div class="progress">
    STEP 01/04
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
  </div>

  <div class="q-label">&gt;&gt; TARGET_RELATION</div>

  <div class="q-text">
    解析対象との関係を選択してください。
  </div>

  <button class="option-btn">PARTNER / 恋人・パートナー</button>
  <button class="option-btn">FAMILY / 家族</button>
  <button class="option-btn">WORK / 職場・上司・同僚</button>
  <button class="option-btn">FRIEND / 友人</button>
  <button class="option-btn">OTHER / その他</button>

  <div class="nav">
    <button class="btn primary">EXECUTE NEXT</button>
  </div>

</div>

<script>
  const buttons = document.querySelectorAll('.option-btn');

  buttons.forEach(btn=>{
    btn.addEventListener('click',()=>{
      buttons.forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
    });
  });
</script>

</body>
</html>
