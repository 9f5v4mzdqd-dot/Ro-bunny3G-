<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>コミュニケーション解析ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100;300;400&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
background: #f5f2ed;
min-height: 100vh;
padding: 28px 20px;
font-family: ‘Noto Sans JP’, sans-serif;
font-weight: 300;
color: #3a3a3a;
}

.container { max-width: 560px; margin: 0 auto; }

.header {
margin-bottom: 28px;
padding-bottom: 16px;
border-bottom: 1px solid #dedad4;
}

.header-label {
font-size: 10px;
color: #5a8a80;
letter-spacing: 0.2em;
margin-bottom: 14px;
font-weight: 300;
}

h1 {
font-size: 22px;
font-weight: 100;
letter-spacing: 0.08em;
line-height: 1.5;
color: #2d2d2d;
}

.step { display: none; }
.step.active { display: block; animation: fadeIn 0.3s ease; }

@keyframes fadeIn {
from { opacity: 0; transform: translateY(6px); }
to { opacity: 1; transform: translateY(0); }
}

.progress {
font-size: 10px;
color: #a8a49e;
margin-bottom: 24px;
letter-spacing: 0.1em;
}

.progress-bar {
height: 1px;
background: #dedad4;
margin-top: 10px;
}

.progress-fill {
height: 100%;
background: #5a8a80;
transition: width 0.4s ease;
}

.q-label {
font-size: 10px;
color: #5a8a80;
letter-spacing: 0.2em;
margin-bottom: 14px;
font-weight: 300;
}

.q-text {
font-size: 15px;
margin-bottom: 20px;
line-height: 1.7;
color: #2d2d2d;
font-weight: 300;
}

.opt-btn {
display: block;
width: 100%;
background: #faf8f5;
border: 1px solid #dedad4;
color: #5a5a5a;
padding: 11px 16px;
text-align: left;
cursor: pointer;
margin-bottom: 6px;
font-family: ‘Noto Sans JP’, sans-serif;
font-weight: 300;
font-size: 14px;
transition: all 0.2s;
border-radius: 2px;
}

.opt-btn:hover { border-color: #5a8a80; background: #f0f5f4; color: #2d2d2d; }

.opt-btn.selected {
background: #5a8a80;
border-color: #5a8a80;
color: #ffffff;
font-weight: 400;
}

.check-btn {
display: flex;
align-items: flex-start;
gap: 12px;
width: 100%;
background: #faf8f5;
border: 1px solid #dedad4;
color: #5a5a5a;
padding: 11px 16px;
text-align: left;
cursor: pointer;
margin-bottom: 6px;
font-family: ‘Noto Sans JP’, sans-serif;
font-weight: 300;
font-size: 14px;
transition: all 0.2s;
border-radius: 2px;
line-height: 1.5;
}

.check-btn:hover { border-color: #5a8a80; background: #f0f5f4; color: #2d2d2d; }

.check-btn.checked {
background: #5a8a80;
border-color: #5a8a80;
color: #ffffff;
font-weight: 400;
}

.check-mark {
font-size: 13px;
min-width: 18px;
color: #c0bcb6;
margin-top: 1px;
flex-shrink: 0;
}

.check-btn.checked .check-mark { color: rgba(255,255,255,0.7); }

.nav { display: flex; gap: 12px; margin-top: 16px; }

.btn {
background: transparent;
border: 1px solid #c0bcb6;
color: #a8a49e;
padding: 12px 24px;
cursor: pointer;
font-family: ‘Noto Sans JP’, sans-serif;
font-size: 12px;
font-weight: 300;
letter-spacing: 0.1em;
transition: all 0.2s;
border-radius: 2px;
}

.btn:hover { border-color: #5a8a80; color: #5a8a80; }
.btn.primary { border-color: #5a8a80; color: #5a8a80; }
.btn.primary:hover { background: #5a8a80; color: #fff; }
.btn:disabled { border-color: #e8e4de; color: #c8c4be; cursor: not-allowed; }
.btn:disabled:hover { background: transparent; border-color: #e8e4de; color: #c8c4be; }

.result { display: none; animation: fadeIn 0.3s ease; }
.result.active { display: block; }

.result-header {
padding-bottom: 24px;
border-bottom: 1px solid #dedad4;
margin-bottom: 40px;
}

.result-label {
font-size: 10px;
color: #5a8a80;
letter-spacing: 0.2em;
margin-bottom: 10px;
font-weight: 300;
}

.result-title {
font-size: 20px;
font-weight: 300;
margin-bottom: 6px;
color: #2d2d2d;
}

.result-sub { font-size: 11px; color: #a8a49e; letter-spacing: 0.1em; }

.game-card {
border: 1px solid #dedad4;
margin-bottom: 16px;
background: #faf8f5;
border-radius: 2px;
overflow: hidden;
}

.game-card-header {
padding: 16px 20px;
border-bottom: 1px solid #dedad4;
background: #f5f2ed;
}

.game-name { font-size: 14px; font-weight: 400; color: #2d2d2d; margin-bottom: 4px; }
.game-trigger { font-size: 10px; color: #5a8a80; letter-spacing: 0.1em; }
.game-body { padding: 20px; }

.section-label {
font-size: 9px;
color: #a8a49e;
letter-spacing: 0.2em;
text-transform: uppercase;
margin-bottom: 8px;
}

.section-text {
font-size: 13px;
line-height: 1.9;
color: #5a5a5a;
margin-bottom: 20px;
font-weight: 300;
}

.advice-text {
font-size: 13px;
line-height: 1.9;
color: #3a3a3a;
border-left: 2px solid #5a8a80;
padding-left: 14px;
font-weight: 300;
}

.divider { border-top: 1px solid #dedad4; margin-top: 36px; padding-top: 24px; }
</style>

</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-label">COMMUNICATION ANALYSIS TOOL</div>
    <h1>コミュニケーション<br>解析ツール</h1>
  </div>

  <div class="step active" id="step1">
    <div class="progress">STEP 01 / 04<div class="progress-bar"><div class="progress-fill" style="width:25%"></div></div></div>
    <div class="q-label">相手との関係</div>
    <div class="q-text">解析したい相手との関係を選んでください。</div>
    <button class="opt-btn" data-group="relation" data-value="partner" onclick="selectOpt(this)">恋人・パートナー</button>
    <button class="opt-btn" data-group="relation" data-value="family" onclick="selectOpt(this)">家族</button>
    <button class="opt-btn" data-group="relation" data-value="work" onclick="selectOpt(this)">職場・上司・同僚</button>
    <button class="opt-btn" data-group="relation" data-value="friend" onclick="selectOpt(this)">友人</button>
    <button class="opt-btn" data-group="relation" data-value="other" onclick="selectOpt(this)">その他</button>
    <div class="nav">
      <button class="btn primary" id="btn1" onclick="goTo(2)" disabled>次へ</button>
    </div>
  </div>

  <div class="step" id="step2">
    <div class="progress">STEP 02 / 04<div class="progress-bar"><div class="progress-fill" style="width:50%"></div></div></div>
    <div class="q-label">繰り返し起きていること</div>
    <div class="q-text">気になっていることを選んでください。<br>複数選べます。</div>
    <button class="check-btn" data-value="blame" onclick="togglePat(this)"><span class="check-mark">○</span><span>謝るが、自分が悪いとは言わない</span></button>
    <button class="check-btn" data-value="control" onclick="togglePat(this)"><span class="check-mark">○</span><span>「あなたのために」と言いながら干渉してくる</span></button>
    <button class="check-btn" data-value="trap" onclick="togglePat(this)"><span class="check-mark">○</span><span>こちらのミスをずっと待っているように感じる</span></button>
    <button class="check-btn" data-value="corner" onclick="togglePat(this)"><span class="check-mark">○</span><span>どちらを選んでも責められる</span></button>
    <button class="check-btn" data-value="yesno" onclick="togglePat(this)"><span class="check-mark">○</span><span>相談してくるが、何を言っても却下される</span></button>
    <button class="check-btn" data-value="violence" onclick="togglePat(this)"><span class="check-mark">○</span><span>気づくと自分が感情的になった側にされている</span></button>
    <button class="check-btn" data-value="woodenleg" onclick="togglePat(this)"><span class="check-mark">○</span><span>過去の苦労や不幸を理由に責任を取らない</span></button>
    <button class="check-btn" data-value="court" onclick="togglePat(this)"><span class="check-mark">○</span><span>第三者を巻き込んで自分の正しさを証明しようとする</span></button>
    <div class="nav">
      <button class="btn" onclick="goTo(1)">戻る</button>
      <button class="btn primary" id="btn2" onclick="goTo(3)" disabled>次へ</button>
    </div>
  </div>

  <div class="step" id="step3">
    <div class="progress">STEP 03 / 04<div class="progress-bar"><div class="progress-fill" style="width:75%"></div></div></div>
    <div class="q-label">今の状況</div>
    <div class="q-text">相手との関係は今どんな状態ですか？</div>
    <button class="opt-btn" data-group="status" data-value="ongoing" onclick="selectOpt(this)">関係が続いている</button>
    <button class="opt-btn" data-group="status" data-value="distance" onclick="selectOpt(this)">距離を置いている</button>
    <button class="opt-btn" data-group="status" data-value="ended" onclick="selectOpt(this)">関係が終わった</button>
    <div class="nav">
      <button class="btn" onclick="goTo(2)">戻る</button>
      <button class="btn primary" id="btn3" onclick="goTo(4)" disabled>次へ</button>
    </div>
  </div>

  <div class="step" id="step4">
    <div class="progress">STEP 04 / 04<div class="progress-bar"><div class="progress-fill" style="width:100%"></div></div></div>
    <div class="q-label">今の自分の状態</div>
    <div class="q-text">今、自分はどんな状態にありますか？</div>
    <button class="opt-btn" data-group="state" data-value="angry" onclick="selectOpt(this)">怒りや混乱がまだ強い</button>
    <button class="opt-btn" data-group="state" data-value="calm" onclick="selectOpt(this)">少し冷静に見られるようになった</button>
    <button class="opt-btn" data-group="state" data-value="organize" onclick="selectOpt(this)">頭の中を整理したい</button>
    <div class="nav">
      <button class="btn" onclick="goTo(3)">戻る</button>
      <button class="btn primary" id="btn4" onclick="showResult()" disabled>解析する</button>
    </div>
  </div>

  <div class="result" id="result">
    <div class="result-header">
      <div class="result-label">解析完了</div>
      <div class="result-title" id="result-title"></div>
      <div class="result-sub" id="result-sub"></div>
    </div>
    <div id="result-cards"></div>
    <div class="divider">
      <button class="btn" onclick="restart()">もう一度解析する</button>
    </div>
  </div>
</div>

<script>
const answers = { relation: null, patterns: [], status: null, state: null };

const games = {
  blame: {
    name: '「あなたのせいだ」パターン', trigger: '責任の転嫁',
    description: '謝罪の言葉を使いながら、実際には責任を相手に転嫁するパターン。「お前が○○したから自分もこうなった」という形で、自分の行動の責任を常に外部に求める。表面上は謝っているように見えるため、指摘しにくい。',
    advice: { ongoing: '相手の謝罪が「でも」や「だって」で続く場合、それは謝罪ではなく反論だ。謝罪と責任転嫁を切り分けて聞く練習をすると、パターンが見えやすくなる。', distance: '距離を置いているなら、相手の謝罪メッセージをそのまま受け取らず、「何に対して謝っているか」を具体的に確認してから返答する。', ended: 'このパターンの中にいた自分は、ずっと「自分が悪いのかもしれない」と思わされ続けた可能性がある。そうではなかった。名前が見えた今、その重さを手放していい。' }
  },
  control: {
    name: '「あなたのために」パターン', trigger: '善意を装った支配',
    description: '支配や干渉を「善意」として包むパターン。相手が抵抗すると「せっかくやってあげているのに」と被害者になる。親切に見えるため、支配されていると気づきにくい。自立しようとすると関係が壊れる構造になっている。',
    advice: { ongoing: '「あなたのために言っている」という言葉が出たとき、その後に何を要求されているかを見る。善意と支配の違いは、こちらの自由が保たれているかどうかだ。', distance: '「あなたのことを心配している」という接触を受けた場合、その心配の中に自分への要求が含まれていないか確認する。', ended: '関係の中で自分の判断を信じられなくなっていた場合、それはこのパターンの影響かもしれない。自分の感覚は正しかった。' }
  },
  trap: {
    name: '「あなたを捕まえた」パターン', trigger: 'ミスの待ち伏せ',
    description: '相手のミスや矛盾を待ち構えて、見つけた瞬間に攻撃するパターン。正義の執行者を装っているが、目的は相手を正しく直すことではなく、相手を「悪い側」に置くことだ。',
    advice: { ongoing: 'ミスを指摘されるたびに委縮している場合、それはこのパターンに取り込まれているサインかもしれない。ミスの内容より、相手の反応のパターンを見る。', distance: 'SNSや共通の知人を通じた監視・批判が続いている場合、このパターンの延長として行われている可能性がある。', ended: '「あのとき自分が悪かった」という罪悪感が残っている場合、それが植え付けられたものかどうか、冷静に検証する価値がある。' }
  },
  corner: {
    name: '「コーナー」パターン', trigger: 'どちらを選んでも責められる',
    description: 'どちらを選んでも相手に非を問われる選択肢を提示するパターン。「行くのも行かないのも怒る」「言っても言わなくても責める」という形で、出口のない状況を作る。長期間続くと判断力が麻痺する。',
    advice: { ongoing: 'どちらを選んでも攻撃されると感じているなら、問題は自分の選択ではなくパターンの構造にある。選択肢を変えても解決しない。', distance: '距離を置いても矛盾したメッセージが来る場合、このパターンが続いている。', ended: '抜け出せなかった理由はこの構造にある。どこに行っても捕まる設計になっていた。逃げられなかったのは弱さではない。' }
  },
  yesno: {
    name: '「はい、でも」パターン', trigger: '助言の拒否',
    description: '助言や提案を求めておきながら、すべてを「はい、でも〜」で却下するパターン。目的は問題を解決することではなく、「誰にも解決できない」ことを証明することだ。相手を疲弊させて諦めさせる効果がある。',
    advice: { ongoing: '何を提案しても却下される場合、提案の質の問題ではない。提案すること自体をやめてみると、関係の構造が見えやすくなる。', distance: '「相談に乗ってほしい」という連絡が来ても、過去のパターンが繰り返される可能性が高い。', ended: 'あなたの提案が悪かったのではない。パターンの設計上、何を言っても採用されなかった。' }
  },
  violence: {
    name: '「暴力沙汰」パターン', trigger: '挑発と被害者の入れ替わり',
    description: '段階的に相手を挑発して、相手が爆発したところで被害者の立場を取るパターン。加害と被害が逆転して見える構造を作り出す。DVやモラハラで頻繁に使われる。',
    advice: { ongoing: '自分が感情的になってしまうことで罪悪感を持っているなら、その前に何が起きていたかを記録しておくことが有効だ。', distance: '「あなたが怒鳴った」「あなたが暴力的だった」という記憶の書き換えが行われている場合、自分の記録と照合する。', ended: '「自分が感情的すぎた」という後悔があるなら、それが挑発の結果だった可能性を検証してみて。あなたは悪くなかったかもしれない。' }
  },
  woodenleg: {
    name: '「木の足」パターン', trigger: '不幸による責任回避',
    description: '自分の不幸・病気・過去のトラウマ・環境を理由に、責任を免除させようとするパターン。「自分はこんなに苦労してきたから仕方ない」という形で使われる。同情を引くことで攻撃への免責を得る。',
    advice: { ongoing: '相手の苦労や背景に同情することと、その行動を許容することは別だ。理由がどれだけ深刻でも、あなたが傷つけられていい理由にはならない。', distance: '過去の辛さを強調する連絡が来ても、それがパターンの一部である可能性がある。', ended: '相手の不幸に責任を感じている場合、それは意図的に植え付けられた感覚かもしれない。' }
  },
  court: {
    name: '「裁判所」パターン', trigger: '第三者を使った正当化',
    description: '共通の知人や家族など第三者を巻き込んで、自分の正しさを証明させようとするパターン。「みんなもそう言っている」という形で多数決による圧力をかける。集団ハラスメントに発展することもある。',
    advice: { ongoing: '第三者を通じた圧力を感じているなら、その第三者が完全な情報を持っていない可能性が高い。一対一で話す場を求めることが有効な場合がある。', distance: '共通の知人を通じた情報操作が行われている可能性がある。直接の情報源を確認する。', ended: '周囲の評価が気になっているなら、その評価がどんな情報を基にしているかを考える。あなたの側の話を知らない人間の判断には限界がある。' }
  }
};

function selectOpt(btn) {
  const group = btn.dataset.group;
  document.querySelectorAll(`[data-group="${group}"]`).forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  answers[group] = btn.dataset.value;
  if (group === 'relation') document.getElementById('btn1').disabled = false;
  if (group === 'status') document.getElementById('btn3').disabled = false;
  if (group === 'state') document.getElementById('btn4').disabled = false;
}

function togglePat(btn) {
  const val = btn.dataset.value;
  const mark = btn.querySelector('.check-mark');
  if (btn.classList.contains('checked')) {
    btn.classList.remove('checked');
    mark.textContent = '○';
    answers.patterns = answers.patterns.filter(p => p !== val);
  } else {
    btn.classList.add('checked');
    mark.textContent = '●';
    answers.patterns.push(val);
  }
  document.getElementById('btn2').disabled = answers.patterns.length === 0;
}

function goTo(n) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById('step' + n).classList.add('active');
  window.scrollTo(0, 0);
}

function showResult() {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById('result').classList.add('active');
  window.scrollTo(0, 0);
  const statusLabels = { ongoing: '関係継続中', distance: '距離を置いている', ended: '関係終了' };
  const stateLabels = { angry: '怒り・混乱', calm: '冷静', organize: '整理中' };
  document.getElementById('result-title').textContent = answers.patterns.length + 'つのパターンが見つかりました';
  document.getElementById('result-sub').textContent = '状況：' + statusLabels[answers.status] + '　状態：' + stateLabels[answers.state];
  const cards = document.getElementById('result-cards');
  cards.innerHTML = '';
  answers.patterns.forEach(p => {
    const g = games[p];
    if (!g) return;
    const advice = g.advice[answers.status] || g.advice['ended'];
    const card = document.createElement('div');
    card.className = 'game-card';
    card.innerHTML = `<div class="game-card-header"><div class="game-name">${g.name}</div><div class="game-trigger">${g.trigger}</div></div><div class="game-body"><div class="section-label">構造</div><div class="section-text">${g.description}</div><div class="section-label">今できること</div><div class="advice-text">${advice}</div></div>`;
    cards.appendChild(card);
  });
}

function restart() {
  answers.relation = null; answers.patterns = []; answers.status = null; answers.state = null;
  document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
  document.querySelectorAll('.check-btn').forEach(b => { b.classList.remove('checked'); b.querySelector('.check-mark').textContent = '○'; });
  ['btn1','btn2','btn3','btn4'].forEach(id => document.getElementById(id).disabled = true);
  document.getElementById('result').classList.remove('active');
  document.getElementById('step1').classList.add('active');
  window.scrollTo(0, 0);
}
</script>

</body>
</html>
