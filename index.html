<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COMM_DEBUG_v2.0</title>

  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100;400&display=swap" rel="stylesheet">

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      -webkit-tap-highlight-color: transparent; /* モバイルでのタップ時ハイライト消去 */
    }

    body{
      background:#1c1f24;
      color:#d4d8de;
      font-family:'Noto Sans JP',sans-serif;
      background-image: radial-gradient(#22262c 1px, transparent 0);
      background-size:20px 20px;
      min-height:100vh;
      padding:40px 20px;
    }

    .container{
      width:100%;
      max-width:400px;
      margin:0 auto;
    }

    .header{
      margin-bottom:48px;
      border-left:3px solid #7eb8d4;
      padding-left:20px;
    }

    .header-label{
      font-family:monospace;
      font-size:10px;
      color:#7eb8d4;
      letter-spacing:0.2em;
      margin-bottom:8px;
    }

    h1{
      font-size:18px;
      font-weight:100;
      letter-spacing:0.15em;
      line-height:1.4;
      text-transform:uppercase;
      color:#e8eaed;
    }

    .progress-section{
      margin-bottom:40px;
    }

    .progress-text{
      font-family:monospace;
      font-size:10px;
      color:#555b66;
      margin-bottom:10px;
      letter-spacing:0.1em;
    }

    .progress-bar{
      height:1px;
      background:#2e333b;
      width:100%;
    }

    .progress-fill{
      height:100%;
      width:25%;
      background:#7eb8d4;
      box-shadow:0 0 8px rgba(126, 184, 212, 0.6);
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .q-label{
      font-family:monospace;
      font-size:11px;
      color:#7eb8d4;
      margin-bottom:12px;
      letter-spacing:0.1em;
    }

    .q-text{
      font-size:15px;
      font-weight:400;
      margin-bottom:32px;
      line-height:1.8;
      color:#c8cdd5;
      min-height:3em;
    }

    .options-container {
      margin-bottom:40px;
    }

    /* ボタンはすべて左揃え */
    .option-btn{
      width:100%;
      background:#22262c;
      border:1px solid #2e333b;
      color:#9098a4;
      padding:16px 20px;
      text-align:left; 
      cursor:pointer;
      margin-bottom:12px;
      font-size:13px;
      transition:all .2s;
      outline: none;
    }

    .option-btn:hover{
      border-color:#7eb8d4;
      color:#e8eaed;
    }

    .option-btn.selected{
      background:rgba(126, 184, 212, 0.1);
      border-color:#7eb8d4;
      color:#e8eaed;
    }

    .nav{
      display:flex;
      justify-content: flex-start; /* 左揃え */
    }

    .btn{
      background:transparent;
      border:1px solid #444b55;
      color:#777f8a;
      padding:14px 28px;
      cursor:pointer;
      font-family:monospace;
      font-size:11px;
      letter-spacing:0.2em;
      transition:all .2s;
      text-transform: uppercase;
      text-align: left;
    }

    .btn.primary{
      border-color:#7eb8d4;
      color:#7eb8d4;
    }

    /* 未選択時のエラーアニメーション（震え） */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
    .shake {
      animation: shake 0.2s ease-in-out 0s 2;
      border-color: #ff4b4b !important;
      color: #ff4b4b !important;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="header">
    <div class="header-label">COMM_DEBUG_v2.0</div>
    <h1>対人構造解析<br>プロトコル</h1>
  </div>

  <div class="progress-section">
    <div class="progress-text" id="step-count">PHASE: 01/04</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>

  <div class="q-label" id="q-label">>> TARGET_RELATION</div>
  <div class="q-text" id="q-text">解析対象との関係を選択してください。</div>

  <div id="options-container" class="options-container">
    <button class="option-btn">PARTNER / 恋人・パートナー</button>
    <button class="option-btn">FAMILY / 家族</button>
    <button class="option-btn">WORK / 職場・上司・同僚</button>
    <button class="option-btn">FRIEND / 友人</button>
    <button class="option-btn">OTHER / その他</button>
  </div>

  <div class="nav">
    <button class="btn primary" id="next-btn">EXECUTE NEXT</button>
  </div>
</div>

<script>
  const protocolData = [
    {
      label: ">> TARGET_RELATION",
      text: "解析対象との関係を選択してください。",
      options: ["PARTNER / 恋人・パートナー", "FAMILY / 家族", "WORK / 職場・上司・同僚", "FRIEND / 友人", "OTHER / その他"]
    },
    {
      label: ">> DETECT_ANOMALY",
      text: "確認された異常動作（バグ）を選択してください。",
      options: ["LOGIC_ERROR / 論理エラー", "EGO_OVERFLOW / 肥大化した自尊心", "COMM_TIMED_OUT / 通信途絶", "SYSTEM_PARASITE / 寄生行為", "UNKNOWN_BUG / 不明なバグ"]
    },
    {
      label: ">> DAMAGE_ASSESSMENT",
      text: "精神的リソースへの侵食度を測定します。",
      options: ["CRITICAL / 致命的", "HIGH / 高", "MODERATE / 中", "LOW / 低", "IGNORE / 無視可能"]
    },
    {
      label: ">> DISPOSAL_METHOD",
      text: "推奨される対抗プロトコルを選択してください。",
      options: ["HARD_RESET / 強制初期化", "BLOCK_FIREWALL / 遮断", "SILENT_DELETE / 静かな削除", "COUNTER / 逆ガスライティング", "BPM_ERROR / 実行拒否"]
    }
  ];

  let currentStep = 0;
  const stepCount = document.getElementById('step-count');
  const progressFill = document.getElementById('progress-fill');
  const qLabel = document.getElementById('q-label');
  const qText = document.getElementById('q-text');
  const optionsContainer = document.getElementById('options-container');
  const nextBtn = document.getElementById('next-btn');

  // ボタンの選択ロジック
  function setupOptionButtons() {
    const buttons = document.querySelectorAll('.option-btn');
    buttons.forEach(btn => {
      btn.onclick = () => {
        buttons.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      };
    });
  }

  // 画面更新
  function updateUI() {
    const data = protocolData[currentStep];
    stepCount.textContent = `PHASE: 0${currentStep + 1}/04`;
    qLabel.textContent = data.label;
    qText.textContent = data.text;
    progressFill.style.width = `${((currentStep + 1) / 4) * 100}%`;

    optionsContainer.innerHTML = '';
    data.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = opt;
      optionsContainer.appendChild(btn);
    });
    setupOptionButtons();
  }

  // Nextボタンの処理
  nextBtn.onclick = () => {
    const selected = document.querySelector('.option-btn.selected');
    
    if (!selected) {
      // 未選択時のエラー演出
      nextBtn.classList.add('shake');
      setTimeout(() => nextBtn.classList.remove('shake'), 400);
      return;
    }

    if (currentStep < protocolData.length - 1) {
      currentStep++;
      updateUI();
    } else {
      showResult();
    }
  };

  function showResult() {
    stepCount.textContent = "PHASE: COMPLETE";
    qLabel.textContent = ">> ANALYSIS_REPORT";
    qText.innerHTML = "解析完了。対象のバグは修復不能です。<br>即時の隔離を推奨します。";
    optionsContainer.innerHTML = '';
    nextBtn.textContent = "SYSTEM REBOOT";
    nextBtn.onclick = () => location.reload();
  }

  // 初回起動
  setupOptionButtons();
</script>

</body>
</html>
