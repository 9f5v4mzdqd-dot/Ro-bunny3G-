<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>対人構造解析プロトコル</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100;300;400&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
background: #1c1f24;
background-image: radial-gradient(#22262c 1px, transparent 0);
background-size: 20px 20px;
min-height: 100vh;
padding: 40px 20px 60px;
font-family: ‘Noto Sans JP’, sans-serif;
font-weight: 100;
color: #d4d8de;
}

.container { max-width: 600px; margin: 0 auto; }

.header {
margin-bottom: 56px;
border-left: 3px solid #7eb8d4;
padding-left: 20px;
}

.header-label {
font-family: monospace;
font-size: 9px;
color: #7eb8d4;
letter-spacing: 0.15em;
margin-bottom: 12px;
}

h1 {
font-size: 20px;
font-weight: 100;
letter-spacing: 0.1em;
line-height: 1.5;
text-transform: uppercase;
color: #e8eaed;
}

.step { display: none; animation: fadeIn 0.25s ease; }
.step.active { display: block; }

@keyframes fadeIn {
from { opacity: 0; transform: translateY(6px); }
to { opacity: 1; transform: translateY(0); }
}

.progress {
font-family: monospace;
font-size: 10px;
color: #555b66;
margin-bottom: 36px;
}

.progress-bar { height: 1px; background: #2e333b; margin-top: 10px; }

.progress-fill {
height: 100%;
background: #7eb8d4;
box-shadow: 0 0 6px #7eb8d4;
transition: width 0.4s ease;
}

.q-label { font-family: monospace; font-size: 11px; color: #7eb8d4; margin-bottom: 16px; }
.q-text { font-size: 16px; margin-bottom: 32px; line-height: 1.7; color: #c8cdd5; }

.option {
display: block; width: 100%; background: #22262c;
border: 1px solid #2e333b; color: #b0b8c4;
padding: 14px 18px; text-align: left; cursor: pointer;
margin-bottom: 10px; font-family: ‘Noto Sans JP’, sans-serif;
font-weight: 100; font-size: 13px; transition: all 0.15s; border-radius: 0;
}
.option:hover { border-color: #555b66; background: #262b32; }
.option.selected { background: #2a4a5e; border-color: #7eb8d4; color: #e8eaed; font-weight: 400; }

.checkbox-option {
display: flex; align-items: flex-start; gap: 12px; width: 100%;
background: #22262c; border: 1px solid #2e333b; color: #b0b8c4;
padding: 14px 18px; text-align: left; cursor: pointer; margin-bottom: 10px;
font-family: ‘Noto Sans JP’, sans-serif; font-weight: 100; font-size: 13px;
transition: all 0.15s; border-radius: 0;
}
.checkbox-option:hover { border-color: #555b66; background: #262b32; }
.checkbox-option.checked { background: #2a4a5e; border-color: #7eb8d4; color: #e8eaed; font-weight: 400; }
.checkbox-mark { font-family: monospace; font-size: 12px; min-width: 20px; color: #444b55; margin-top: 1px; }
.checkbox-option.checked .checkbox-mark { color: #7eb8d4; }

.nav { display: flex; gap: 12px; margin-top: 8px; }

.btn {
background: transparent; border: 1px solid #444b55; color: #777f8a;
padding: 12px 24px; cursor: pointer; font-family: monospace;
font-size: 11px; letter-spacing: 0.15em; transition: all 0.15s; border-radius: 0;
}
.btn:hover { border-color: #7eb8d4; color: #7eb8d4; }
.btn.primary { border-color: #7eb8d4; color: #7eb8d4; }
.btn.primary:hover { background: #7eb8d4; color: #1c1f24; }
.btn:disabled { border-color: #2e333b; color: #333a44; cursor: not-allowed; }
.btn:disabled:hover { background: transparent; border-color: #2e333b; color: #333a44; }

.result { display: none; animation: fadeIn 0.3s ease; }
.result.active { display: block; }

.result-header { border-left: 6px solid #7eb8d4; padding-left: 20px; margin-bottom: 48px; }
.result-label { font-family: monospace; font-size: 10px; color: #7eb8d4; letter-spacing: 0.2em; margin-bottom: 10px; }
.result-title { font-size: 22px; font-weight: 400; text-transform: uppercase; margin-bottom: 6px; color: #e8eaed; }
.result-sub { font-family: monospace; font-size: 10px; color: #555b66; }

.game-card { border: 1px solid #2e333b; margin-bottom: 20px; background: #1c1f24; }
.game-card-header { padding: 18px 20px; border-bottom: 1px solid #2e333b; background: #22262c; }
.game-name { font-size: 14px; font-weight: 400; color: #7eb8d4; text-transform: uppercase; margin-bottom: 4px; }
.game-trigger { font-family: monospace; font-size: 9px; color: #444b55; letter-spacing: 0.1em; }
.game-body { padding: 20px; }
.section-label { font-family: monospace; font-size: 9px; color: #555b66; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 8px; }
.section-text { font-size: 13px; line-height: 1.8; color: #b0b8c4; margin-bottom: 20px; }
.advice-text { font-size: 13px; line-height: 1.8; color: #d4d8de; border-left: 1px solid #7eb8d4; padding-left: 14px; }
.divider { border-top: 1px solid #2e333b; margin-top: 36px; padding-top: 24px; }
</style>

</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-label">COMM_DEBUG_v2.0</div>
    <h1>対人構造解析<br>プロトコル</h1>
  </div>

  <div class="step active" id="step1">
    <div class="progress">STEP 01/04<div class="progress-bar"><div class="progress-fill" style="width:25%"></div></div></div>
    <div class="q-label">&gt;&gt; TARGET_RELATION</div>
    <div class="q-text">解析対象との関係を選択してください。</div>
    <button class="option" data-value="partner" onclick="selectOption('relation',this)">PARTNER / 恋人・パートナー</button>
    <button class="option" data-value="family" onclick="selectOption('relation',this)">FAMILY / 家族</button>
    <button class="option" data-value="work" onclick="selectOption('relation',this)">WORK / 職場・上司・同僚</button>
    <button class="option" data-value="friend" onclick="selectOption('relation',this)">FRIEND / 友人</button>
    <button class="option" data-value="other" onclick="selectOption('relation',this)">OTHER / その他</button>
    <div class="nav"><button class="btn primary" id="btn1" disabled onclick="goStep(2)">EXECUTE NEXT</button></div>
  </div>

  <div class="step" id="step2">
    <div class="progress">STEP 02/04<div class="progress-bar"><div class="progress-fill" style="width:50%"></div></div></div>
    <div class="q-label">&gt;&gt; ERROR_PATTERN</div>
    <div class="q-text">検出されたバグ（繰り返し起きる現象）<br>当てはまるものをすべて選んでください。</div>
    <button class="checkbox-option" data-value="blame" onclick="togglePat(this)"><span class="checkbox-mark">[ ]</span><span>謝るが、自分が悪いとは言わない</span></button>
    <button class="checkbox-option" data-value="control" onclick="togglePat(this)"><span class="checkbox-mark">[ ]</span><span>善意を装った支配</span></button>
    <button class="checkbox-option" data-value="trap" onclick="togglePat(this)"><span class="checkbox-mark">[ ]</span><span>ミスの待ち伏せ攻撃</span></button>
    <button class="checkbox-option" data-value="corner" onclick="togglePat(this)"><span class="checkbox-mark">[ ]</span><span>ダブルバインド（どちらを選んでも罰）</span></button>
    <button class="checkbox-option" data-value="yesno" onclick="togglePat(this)"><span class="checkbox-mark">[ ]</span><span>助言を求めるが全部却下する</span></button>
    <button class="checkbox-option" data-value="violence" onclick="togglePat(this)"><span class="checkbox-mark">[ ]</span><span>挑発して自分が被害者になる</span></button>
    <button class="checkbox-option" data-value="woodenleg" onclick="togglePat(this)"><span class="checkbox-mark">[ ]</span><span>不幸・ハンデを理由に責任を取らない</span></button>
    <button class="checkbox-option" data-value="court" onclick="togglePat(this)"><span class="checkbox-mark">[ ]</span><span>第三者を巻き込んで正当化する</span></button>
    <div class="nav">
      <button class="btn" onclick="goStep(1)">BACK</button>
      <button class="btn primary" id="btn2" disabled onclick="goStep(3)">ANALYZE PATTERN</button>
    </div>
  </div>

  <div class="step" id="step3">
    <div class="progress">STEP 03/04<div class="progress-bar"><div class="progress-fill" style="width:75%"></div></div></div>
    <div class="q-label">&gt;&gt; CURRENT_STATUS</div>
    <div class="q-text">現在の接続状況</div>
    <button class="option" data-value="ongoing" onclick="selectOption('status',this)">CONNECTED / 関係継続中</button>
    <button class="option" data-value="distance" onclick="selectOption('status',this)">FIREWALL / 距離を置いている</button>
    <button class="option" data-value="ended" onclick="selectOption('status',this)">DISCONNECTED / 終了</button>
    <div class="nav">
      <button class="btn" onclick="goStep(2)">BACK</button>
      <button class="btn primary" id="btn3" disabled onclick="goStep(4)">NEXT</button>
    </div>
  </div>

  <div class="step" id="step4">
    <div class="progress">STEP 04/04<div class="progress-bar"><div class="progress-fill" style="width:100%"></div></div></div>
    <div class="q-label">&gt;&gt; USER_CONDITION</div>
    <div class="q-text">あなたの内部ステータス</div>
    <button class="option" data-value="angry" onclick="selectOption('state',this)">HIGH_HEAT / まだ怒りが強い</button>
    <button class="option" data-value="calm" onclick="selectOption('state',this)">STABLE / 少し冷静に見られる</button>
    <button class="option" data-value="organize" onclick="selectOption('state',this)">DEFRAG / 整理したい</button>
    <div class="nav">
      <button class="btn" onclick="goStep(3)">BACK</button>
      <button class="btn primary" id="btn4" disabled onclick="showResult()">GENERATE REPORT</button>
    </div>
  </div>

  <div class="result" id="result">
    <div class="result-header">
      <div class="result-label">DECODING COMPLETE</div>
      <div class="result-title" id="result-title"></div>
      <div class="result-sub" id="result-sub"></div>
    </div>
    <div id="result-cards"></div>
    <div class="divider"><button class="btn" onclick="restart()">REBOOT SYSTEM</button></div>
  </div>
</div>

<script>
const answers = { relation: null, patterns: [], status: null, state: null };

const games = {
  blame: {
    name: '「あなたのせいだ」ゲーム', trigger: 'RESPONSIBILITY_SHIFT',
    description: '謝罪の言葉を使いながら、実際には責任を相手に転嫁するパターン。「お前が○○したから自分もこうなった」という形で、自分の行動の責任を常に外部に求める。表面上は謝っているように見えるため、指摘しにくい。',
    advice: { ongoing: '相手の謝罪が「でも」や「だって」で続く場合、それは謝罪ではなく反論だ。謝罪と責任転嫁を切り分けて聞く練習をすると、パターンが見えやすくなる。', distance: '距離を置いているなら、相手の謝罪メッセージをそのまま受け取らず、「何に対して謝っているか」を具体的に確認してから返答する。', ended: 'このゲームの中にいた自分は、ずっと「自分が悪いのかもしれない」と思わされ続けた可能性がある。そうではなかった。パターンの名前が見えた今、その重さを手放していい。' }
  },
  control: {
    name: '「あなたのために」ゲーム', trigger: 'BENEVOLENT_CONTROL',
    description: '支配や干渉を「善意」として包むパターン。相手が抵抗すると「せっかくやってあげているのに」と被害者になる。親切に見えるため、支配されていると気づきにくい。自立しようとすると関係が壊れる構造になっている。',
    advice: { ongoing: '「あなたのために言っている」という言葉が出たとき、その後に何を要求されているかを見る。善意と支配の違いは、こちらの自由が保たれているかどうかだ。', distance: '「あなたのことを心配している」という接触を受けた場合、その心配の中に自分への要求が含まれていないか確認する。', ended: '関係の中で自分の判断を信じられなくなっていた場合、それはこのゲームの影響かもしれない。自分の感覚は正しかった。' }
  },
  trap: {
    name: '「あなたを捕まえた」ゲーム', trigger: 'ERROR_HUNTING',
    description: '相手のミスや矛盾を待ち構えて、見つけた瞬間に攻撃するパターン。正義の執行者を装っているが、目的は相手を正しく直すことではなく、相手を「悪い側」に置くことだ。',
    advice: { ongoing: 'ミスを指摘されるたびに委縮している場合、それはこのゲームに取り込まれているサインかもしれない。ミスの内容より、相手の反応のパターンを見る。', distance: 'SNSや共通の知人を通じた監視・批判が続いている場合、このパターンの延長として行われている可能性がある。', ended: '「あのとき自分が悪かった」という罪悪感が残っている場合、それがゲームによって植え付けられたものかどうか、冷静に検証する価値がある。' }
  },
  corner: {
    name: '「コーナー」ゲーム', trigger: 'DOUBLE_BIND',
    description: 'どちらを選んでも相手に非を問われる選択肢を提示するパターン。「行くのも行かないのも怒る」「言っても言わなくても責める」という形で、出口のない状況を作る。長期間続くと判断力が麻痺する。',
    advice: { ongoing: 'どちらを選んでも攻撃されると感じているなら、問題は自分の選択ではなくゲームの構造にある。選択肢を変えても解決しない。', distance: '距離を置いても矛盾したメッセージが来る場合、コーナーゲームが続いている。', ended: '抜け出せなかった理由はこの構造にある。どこに行っても捕まる設計になっていた。逃げられなかったのは弱さではない。' }
  },
  yesno: {
    name: '「はい、でも」ゲーム', trigger: 'HELP_REJECTION',
    description: '助言や提案を求めておきながら、すべてを「はい、でも〜」で却下するパターン。目的は問題を解決することではなく、「誰にも解決できない」ことを証明することだ。相手を疲弊させて諦めさせる効果がある。',
    advice: { ongoing: '何を提案しても却下される場合、提案の質の問題ではない。提案すること自体をやめてみると、関係の構造が見えやすくなる。', distance: '「相談に乗ってほしい」という連絡が来ても、過去のパターンが繰り返される可能性が高い。', ended: 'あなたの提案が悪かったのではない。ゲームの設計上、何を言っても採用されなかった。' }
  },
  violence: {
    name: '「暴力沙汰」ゲーム', trigger: 'PROVOCATION_LOOP',
    description: '段階的に相手を挑発して、相手が爆発したところで被害者の立場を取るパターン。加害と被害が逆転して見える構造を作り出す。DVやモラハラで頻繁に使われる。',
    advice: { ongoing: '自分が感情的になってしまうことで罪悪感を持っているなら、その前に何が起きていたかを記録しておくことが有効だ。', distance: '「あなたが怒鳴った」「あなたが暴力的だった」という記憶の書き換えが行われている場合、自分の記録と照合する。', ended: '「自分が感情的すぎた」という後悔があるなら、それが挑発の結果だった可能性を検証してみて。あなたは悪くなかったかもしれない。' }
  },
  woodenleg: {
    name: '「木の足」ゲーム', trigger: 'VICTIM_SHIELD',
    description: '自分の不幸・病気・過去のトラウマ・環境を理由に、責任を免除させようとするパターン。「自分はこんなに苦労してきたから仕方ない」という形で使われる。同情を引くことで攻撃への免責を得る。',
    advice: { ongoing: '相手の苦労や背景に同情することと、その行動を許容することは別だ。理由がどれだけ深刻でも、あなたが傷つけられていい理由にはならない。', distance: '過去の辛さを強調する連絡が来ても、それがゲームの一部である可能性がある。', ended: '相手の不幸に責任を感じている場合、それは意図的に植え付けられた感覚かもしれない。' }
  },
  court: {
    name: '「裁判所」ゲーム', trigger: 'THIRD_PARTY_ATTACK',
    description: '共通の知人や家族など第三者を巻き込んで、自分の正しさを証明させようとするパターン。「みんなもそう言っている」という形で多数決による圧力をかける。集団ハラスメントに発展することもある。',
    advice: { ongoing: '第三者を通じた圧力を感じているなら、その第三者が完全な情報を持っていない可能性が高い。一対一で話す場を求めることが有効な場合がある。', distance: '共通の知人を通じた情報操作が行われている可能性がある。直接の情報源を確認する。', ended: '周囲の評価が気になっているなら、その評価がどんな情報を基にしているかを考える。あなたの側の話を知らない人間の判断には限界がある。' }
  }
};

const statusLabels = { ongoing: 'CONNECTED', distance: 'FIREWALL', ended: 'DISCONNECTED' };
const stateLabels = { angry: 'HIGH_HEAT', calm: 'STABLE', organize: 'DEFRAG' };

function selectOption(type, btn) {
  const siblings = btn.parentElement.querySelectorAll('.option');
  siblings.forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  answers[type] = btn.dataset.value;
  if (type === 'relation') document.getElementById('btn1').disabled = false;
  if (type === 'status') document.getElementById('btn3').disabled = false;
  if (type === 'state') document.getElementById('btn4').disabled = false;
}

function togglePat(btn) {
  const val = btn.dataset.value;
  const mark = btn.querySelector('.checkbox-mark');
  if (btn.classList.contains('checked')) {
    btn.classList.remove('checked');
    mark.textContent = '[ ]';
    answers.patterns = answers.patterns.filter(p => p !== val);
  } else {
    btn.classList.add('checked');
    mark.textContent = '[x]';
    answers.patterns.push(val);
  }
  document.getElementById('btn2').disabled = answers.patterns.length === 0;
}

function goStep(n) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById('step' + n).classList.add('active');
  window.scrollTo(0, 0);
}

function showResult() {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById('result').classList.add('active');
  window.scrollTo(0, 0);
  const status = answers.status;
  document.getElementById('result-title').textContent =
    answers.patterns.length + ' PATTERN' + (answers.patterns.length > 1 ? 'S' : '') + ' DETECTED';
  document.getElementById('result-sub').textContent =
    'STATUS: ' + statusLabels[status] + ' / STATE: ' + stateLabels[answers.state];
  const cards = document.getElementById('result-cards');
  cards.innerHTML = '';
  answers.patterns.forEach(p => {
    const g = games[p];
    if (!g) return;
    const advice = g.advice[status] || g.advice['ended'];
    const card = document.createElement('div');
    card.className = 'game-card';
    card.innerHTML = `
      <div class="game-card-header">
        <div class="game-name">${g.name}</div>
        <div class="game-trigger">TRIGGER: ${g.trigger}</div>
      </div>
      <div class="game-body">
        <div class="section-label">ANALYSIS</div>
        <div class="section-text">${g.description}</div>
        <div class="section-label">ADVICE</div>
        <div class="advice-text">${advice}</div>
      </div>`;
    cards.appendChild(card);
  });
}

function restart() {
  answers.relation = null; answers.patterns = []; answers.status = null; answers.state = null;
  document.querySelectorAll('.option').forEach(b => b.classList.remove('selected'));
  document.querySelectorAll('.checkbox-option').forEach(b => {
    b.classList.remove('checked');
    b.querySelector('.checkbox-mark').textContent = '[ ]';
  });
  ['btn1','btn2','btn3','btn4'].forEach(id => document.getElementById(id).disabled = true);
  document.getElementById('result').classList.remove('active');
  document.getElementById('step1').classList.add('active');
  window.scrollTo(0, 0);
}
</script>

</body>
</html>
